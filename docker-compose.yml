services:
  # Service Jupyter pour les notebooks
  jupyter:
    build: .
    container_name: illuin_jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/app
      - hf_cache:/app/.cache/huggingface
      - jupyter_data:/root/.jupyter
    environment:
      - HF_HOME=/app/.cache/huggingface
      - HF_HUB_CACHE=/app/.cache/huggingface/hub
      - HF_DATASETS_CACHE=/app/.cache/huggingface/datasets
    command: uv run jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --ServerApp.token='illuin2024'
    networks:
      - illuin_network

  # Service CLI pour les prédictions
  cli:
    build: .
    container_name: illuin_cli
    volumes:
      - .:/app
      - hf_cache:/app/.cache/huggingface
    environment:
      - HF_HOME=/app/.cache/huggingface
      - HF_HUB_CACHE=/app/.cache/huggingface/hub
      - HF_DATASETS_CACHE=/app/.cache/huggingface/datasets
    # Pas de commande par défaut, on l'exécute via docker-compose run
    entrypoint: ["uv", "run", "python", "scripts/predict.py"]
    networks:
      - illuin_network
    profiles:
      - cli

volumes:
  # Volume persistant pour le cache Hugging Face (évite de re-télécharger les modèles)
  hf_cache:
    driver: local
  # Volume persistant pour les données Jupyter (config, etc.)
  jupyter_data:
    driver: local

networks:
  illuin_network:
    driver: bridge

